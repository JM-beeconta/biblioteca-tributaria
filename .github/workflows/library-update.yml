name: Actualizar Biblioteca Tributaria

on:
  schedule:
    - cron: '17 6 * * 1'
      timezone: 'America/Santiago'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Instalar extractores históricos
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils antiword catdoc unzip unrtf

      - name: Configurar identidad del bot
        run: |
          git config user.name "beeconta-library-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Actualizar últimos dos años y base legal vigente
        run: node scripts/update.mjs --weekly

      - name: Guardar cambios
        shell: bash
        run: |
          set -euo pipefail
          git add data content
          if git diff --cached --quiet; then
            echo "Sin cambios de fuente."
            exit 0
          fi
          git commit -m "chore: actualización semanal SII y BCN"
          # git push puede perder la carrera contra otro workflow empujando a main al mismo
          # tiempo (visto en producción: "fetch first" incluso después del rebase, porque otro
          # push llegó en la ventana entre el rebase y el push) — sin reintento, todo el trabajo
          # de esta corrida se pierde en silencio al terminar el job. Se reintenta con backoff.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt/5), reintentando..."
            sleep $((attempt * 5))
          done
          echo "No se pudo publicar tras 5 intentos" >&2
          exit 1
