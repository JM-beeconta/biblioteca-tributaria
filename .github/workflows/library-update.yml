name: Actualizar Biblioteca Tributaria

on:
  # 3 revisiones al día (hora de Chile). La de la mañana incluye LeyChile/BCN, que es la descarga
  # pesada y no cambia varias veces al día; las otras dos sólo revisan el SII (2 últimos años).
  # GitHub puede atrasar un cron programado entre 5 y 30 minutos en horas de alta carga.
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Santiago'
    - cron: '17 13 * * *'
      timezone: 'America/Santiago'
    - cron: '17 19 * * *'
      timezone: 'America/Santiago'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Instalar extractores históricos
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils antiword catdoc unzip unrtf

      - name: Configurar identidad del bot
        run: |
          git config user.name "beeconta-library-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Actualizar últimos dos años (y base legal vigente en la corrida de la mañana)
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != '17 7 * * *' ]; then
            node scripts/update.mjs --weekly --skip-bcn
          else
            node scripts/update.mjs --weekly
          fi

      - name: Guardar cambios
        shell: bash
        run: |
          set -euo pipefail
          git add data content
          if git diff --cached --quiet; then
            echo "Sin cambios de fuente."
            exit 0
          fi
          git commit -m "chore: actualización SII y BCN"
          # git push puede perder la carrera contra otro workflow empujando a main al mismo
          # tiempo (visto en producción: "fetch first" incluso después del rebase, porque otro
          # push llegó en la ventana entre el rebase y el push) — sin reintento, todo el trabajo
          # de esta corrida se pierde en silencio al terminar el job. Se reintenta con backoff.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt/5), reintentando..."
            sleep $((attempt * 5))
          done
          echo "No se pudo publicar tras 5 intentos" >&2
          exit 1
