name: Actualizar Biblioteca Tributaria

on:
  schedule:
    - cron: '17 6 * * 1'
      timezone: 'America/Santiago'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Instalar extractores históricos
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils antiword catdoc unzip unrtf

      - name: Configurar identidad del bot
        run: |
          git config user.name "beeconta-library-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Actualizar últimos dos años y base legal vigente
        run: node scripts/update.mjs --weekly

      - name: Guardar cambios
        shell: bash
        run: |
          set -euo pipefail
          git add data content
          if git diff --cached --quiet; then
            echo "Sin cambios de fuente."
            exit 0
          fi
          git commit -m "chore: actualización semanal SII y BCN"
          git pull --rebase origin main
          git push
