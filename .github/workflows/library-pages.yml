name: Publicar Biblioteca Tributaria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: biblioteca-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Construir sitio estático
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar publicación
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/" -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/index.json" -o /tmp/index.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/llms.txt" -o /tmp/llms.txt
          node -e "JSON.parse(require('fs').readFileSync('/tmp/index.json','utf8'));"
          test -s /tmp/home.html
          test -s /tmp/llms.txt

          mkdir -p data
          node -e "const fs=require('fs'); fs.writeFileSync('data/deploy-health.json', JSON.stringify({status:'ok', checked_at:new Date().toISOString(), page_url:process.env.PAGE_URL}, null, 2)+'\\n');"

          git config user.name "beeconta-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deploy-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar verificación de Pages"
            git pull --rebase origin main
            git push
          fi
