name: Publicar Biblioteca Tributaria

on:
  push:
    branches: [main]
  # Los workflows que cargan/reparan datos hacen su propio commit y push con el GITHUB_TOKEN por
  # defecto. GitHub NO dispara otros workflows (incluido este, por `push`) a partir de un push
  # hecho con GITHUB_TOKEN — es una protección anti-recursión del propio GitHub Actions. Sin este
  # trigger por workflow_run, cada carga/reparación real quedaba commiteada en main pero el sitio
  # publicado seguía mostrando los datos viejos indefinidamente, sin ningún error visible.
  workflow_run:
    workflows:
      - 'Actualizar Biblioteca Tributaria'
      - 'Reparar Base Legal BCN'
      - 'Cargar Historia Tributaria Completa'
      - 'Backfill Resoluciones SII'
      - 'Rellenar Brechas SII'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biblioteca-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Construir sitio estático
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Validar catálogo, contador y lector HTML
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const catalog = JSON.parse(fs.readFileSync('dist/data/catalog.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
          const backfill = JSON.parse(fs.readFileSync('dist/data/backfill-status.json', 'utf8'));
          if (!Array.isArray(catalog) || !catalog.length) throw new Error('catalog.json vacío');
          if (manifest.total_documents !== catalog.length) throw new Error(`manifest=${manifest.total_documents}, catálogo=${catalog.length}`);
          if (backfill.status === 'completed' && catalog.length < 8000) throw new Error(`Histórico marcado completo con sólo ${catalog.length} documentos`);
          const invalidSummary = catalog.find((doc) => !doc.summary_short || /[\r\n]/.test(doc.summary_short));
          if (invalidSummary) throw new Error(`summary_short inválido: ${invalidSummary.id}`);
          const sample = catalog.find((doc) => doc.source === 'SII' && doc.type === 'oficio') || catalog[0];
          if (!sample.html_path) throw new Error(`html_path ausente: ${sample.id}`);
          const htmlFile = path.join('dist', sample.html_path);
          if (!fs.existsSync(htmlFile)) throw new Error(`ficha HTML ausente: ${sample.html_path}`);
          const html = fs.readFileSync(htmlFile, 'utf8');
          if (!html.includes('document-shell') || !html.includes('Texto del documento')) throw new Error(`ficha HTML incompleta: ${sample.id}`);
          const home = fs.readFileSync('dist/index.html','utf8');
          if(!home.includes('corpusTotal') || !home.includes('backfillProgress')) throw new Error('monitor de corpus ausente');
          console.log(`Publicación validada: ${catalog.length} documentos; backfill=${backfill.status}.`);
          NODE
          du -sh dist

      - uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar corpus publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Antes esto usaba curl por línea de comandos; curl empezó a fallar en todos los runners
          # con "URL rejected: Malformed input to a URL function" incluso con la URL saneada a mano
          # (probablemente un problema del binario/imagen del runner, no de este script). fetch()
          # de Node evita por completo esa capa.
          node <<'NODE'
          async function getText(url, { retries = 8, delayMs = 3000 } = {}) {
            let lastError;
            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                return await response.text();
              } catch (error) {
                lastError = error;
                if (attempt < retries) await new Promise((r) => setTimeout(r, delayMs));
              }
            }
            throw new Error(`No se pudo obtener ${url}: ${lastError.message}`);
          }

          async function main() {
            const base = (process.env.PAGE_URL || '').trim().replace(/\/$/, '');
            if (!base) throw new Error('PAGE_URL vacío');
            const bust = Date.now();
            const at = (path) => `${base}${path}${path.includes('?') ? '&' : '?'}v=${bust}`;

            const [home, catalogRaw, manifestRaw, backfillRaw, llms] = await Promise.all([
              getText(at('/')),
              getText(at('/data/catalog.json')),
              getText(at('/data/manifest.json')),
              getText(at('/data/backfill-status.json')),
              getText(at('/llms.txt')),
            ]);

            const catalog = JSON.parse(catalogRaw);
            const manifest = JSON.parse(manifestRaw);
            const backfill = JSON.parse(backfillRaw);
            if (!Array.isArray(catalog) || !catalog.length) throw new Error('catálogo publicado vacío');
            if (Number(manifest.total_documents) !== catalog.length) throw new Error(`publicado: manifest=${manifest.total_documents}, catálogo=${catalog.length}`);
            if (backfill.status !== 'completed') throw new Error(`backfill publicado no está completo: ${backfill.status}`);
            if (catalog.length < 8000) throw new Error(`corpus publicado incompleto: ${catalog.length}`);
            if (!home.includes('corpusTotal')) throw new Error('monitor de corpus ausente en portada');
            if (!llms.trim()) throw new Error('llms.txt vacío');

            const sample = catalog.find((d) => d.source === 'SII' && d.type === 'oficio') || catalog[0];
            if (!sample?.html_path || !sample?.summary_short) throw new Error('ficha de muestra inválida');

            const documentHtml = await getText(at(`/${sample.html_path}`));
            if (!documentHtml.includes('document-shell')) throw new Error('ficha HTML sin document-shell');
            if (!documentHtml.includes('Texto del documento')) throw new Error('ficha HTML sin "Texto del documento"');

            console.log(`Pages verificado: ${base}`);
            console.log(`Corpus público verificado: ${catalog.length} documentos.`);
          }

          main().catch((error) => { console.error(error.message); process.exit(1); });
          NODE
