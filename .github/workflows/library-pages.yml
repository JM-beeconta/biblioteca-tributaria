name: Publicar Biblioteca Tributaria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biblioteca-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Construir sitio estático
        run: npm run build

      - name: Validar catálogo, contador y lector HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const catalog = JSON.parse(fs.readFileSync('dist/data/catalog.json', 'utf8'));
          if (!Array.isArray(catalog) || !catalog.length) throw new Error('catalog.json vacío');
          const invalidSummary = catalog.find((doc) => !doc.summary_short || /[\r\n]/.test(doc.summary_short));
          if (invalidSummary) throw new Error(`summary_short inválido: ${invalidSummary.id}`);
          const sample = catalog.find((doc) => doc.source === 'SII' && doc.type === 'oficio') || catalog[0];
          if (!sample.html_path) throw new Error(`html_path ausente: ${sample.id}`);
          const htmlFile = path.join('dist', sample.html_path);
          if (!fs.existsSync(htmlFile)) throw new Error(`ficha HTML ausente: ${sample.html_path}`);
          const html = fs.readFileSync(htmlFile, 'utf8');
          if (!html.includes('document-shell') || !html.includes('Texto del documento')) throw new Error(`ficha HTML incompleta: ${sample.id}`);
          const home = fs.readFileSync('dist/index.html','utf8');
          if(!home.includes('corpusTotal') || !home.includes('backfillProgress')) throw new Error('monitor de corpus ausente');
          const manifestPath='dist/data/manifest.json';
          if(fs.existsSync(manifestPath)) {
            const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
            if(manifest.total_documents!==catalog.length) throw new Error(`manifest=${manifest.total_documents}, catálogo=${catalog.length}`);
          }
          console.log(`Publicación validada: ${catalog.length} documentos.`);
          NODE

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar publicación
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/" -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/catalog.json" -o /tmp/catalog.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/meta.json" -o /tmp/meta.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/llms.txt" -o /tmp/llms.txt
          SAMPLE_PATH=$(node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8'));
          if(!Array.isArray(c)||!c.length) process.exit(1);
          if(Number(m.total_documents||c.length)!==c.length) process.exit(1);
          const sample=c.find(d=>d.source==='SII'&&d.type==='oficio')||c[0];
          if(!sample?.html_path||!sample?.summary_short) process.exit(1);
          process.stdout.write(sample.html_path);
          NODE
          )
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/$SAMPLE_PATH" -o /tmp/document.html
          grep -q 'document-shell' /tmp/document.html
          grep -q 'Texto del documento' /tmp/document.html
          grep -q 'corpusTotal' /tmp/home.html
          test -s /tmp/llms.txt
          echo "Pages verificado: $BASE"
