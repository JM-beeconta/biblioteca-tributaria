name: Publicar Biblioteca Tributaria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biblioteca-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Construir sitio estático
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar publicación
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/" -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/catalog.json" -o /tmp/catalog.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/data/index.json" -o /tmp/index.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/llms.txt" -o /tmp/llms.txt
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8')); const i=JSON.parse(fs.readFileSync('/tmp/index.json','utf8')); if(!Array.isArray(c)||!Array.isArray(i)||c.length!==i.length) process.exit(1); console.log('Documentos publicados:', c.length);"
          test -s /tmp/home.html
          test -s /tmp/llms.txt
          echo "Pages verificado: $BASE"
