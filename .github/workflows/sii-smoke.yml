name: Smoke SII 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sii-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: biblioteca-tributaria
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Instalar extractor PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Ingestar 2026
        id: ingest
        continue-on-error: true
        run: node scripts/update.mjs --from=2026 --to=2026

      - name: Validar y registrar resultado
        id: validate
        if: always()
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let index = [];
          let meta = {};
          try { index = JSON.parse(fs.readFileSync('data/index.json','utf8')); } catch {}
          try { meta = JSON.parse(fs.readFileSync('data/meta.json','utf8')); } catch {}
          const docs2026 = index.filter(d => Number(d.year) === 2026);
          const oficios2026 = docs2026.filter(d => d.source === 'SII' && d.type === 'oficio');
          const circulares2026 = docs2026.filter(d => d.source === 'SII' && d.type === 'circular');
          const oficio2111 = oficios2026.find(d => Number(d.number) === 2111);
          const report = {
            checked_at: new Date().toISOString(),
            ingest_outcome: process.env.INGEST_OUTCOME,
            total_documents: index.length,
            documents_2026: docs2026.length,
            oficios_2026: oficios2026.length,
            circulares_2026: circulares2026.length,
            oficio_2111_found: Boolean(oficio2111),
            oficio_2111_format: oficio2111?.format ?? null,
            meta,
          };
          report.status = process.env.INGEST_OUTCOME === 'success' && oficios2026.length >= 50 && Boolean(oficio2111) ? 'ok' : 'fail';
          fs.writeFileSync('data/update-smoke.json', JSON.stringify(report, null, 2) + '\n');
          console.log(report);
          NODE

          git config user.name "beeconta-smoke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data content
          if ! git diff --cached --quiet; then
            git commit -m "chore: smoke corpus SII 2026"
            git pull --rebase origin main
            git push
          fi

          node -e "const r=require('./data/update-smoke.json'); if(r.status!=='ok') process.exit(1)"

      - name: Construir sitio
        if: success()
        run: npm run build

      - uses: actions/configure-pages@v5
        if: success()

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Publicar corpus 2026 validado
        id: deployment
        uses: actions/deploy-pages@v4
