name: Reparar Base Legal BCN

on:
  push:
    branches: [main]
    paths:
      - '.bcn-repair-request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-bcn-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar tests
        run: npm test

      - name: Exportar LeyChile
        run: node scripts/export-bcn.mjs --out=.bcn-output

      - name: Validar, diagnosticar y fusionar
        shell: bash
        run: |
          set -euo pipefail
          VALID=$(node <<'NODE'
          const fs=require('fs');
          const docs=JSON.parse(fs.readFileSync('.bcn-output/docs.json','utf8'));
          const article31=docs.some(d=>d.type==='articulo'&&d.norm_code==='LIR'&&String(d.article)==='31');
          const historical=docs.filter(d=>d.historical_version).length;
          process.stdout.write(String(docs.length>=100 && article31 && historical>0));
          NODE
          )

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p data/diagnostics
          cp .bcn-output/stats.json data/diagnostics/bcn-repair.json

          if [ "$VALID" = "true" ]; then
            node scripts/merge-range.mjs --input=.bcn-output --range=BCN --total=14
            STATUS=completed
            MESSAGE="chore: reparar base legal BCN con artículos y versiones"
          else
            STATUS=failed
            MESSAGE="chore: registrar diagnóstico fallido de BCN"
          fi

          STATUS="$STATUS" node <<'NODE'
          const fs=require('fs');
          const marker={status:process.env.STATUS,updated_at:new Date().toISOString()};
          fs.writeFileSync('.bcn-repair-request',JSON.stringify(marker,null,2)+'\n');
          NODE

          git config user.name "beeconta-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data content .bcn-repair-request
          git commit -m "$MESSAGE" || true
          git pull --rebase origin main
          git push
